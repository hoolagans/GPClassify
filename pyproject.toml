[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpclassify"
version = "0.1.2"
description = "Decision Tree Genetic Programming classifier with a scikit-learn-style API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["genetic programming", "classification", "machine learning", "decision tree", "evolutionary computation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hoolagans/GPClassify"
Repository = "https://github.com/hoolagans/GPClassify"
Issues = "https://github.com/hoolagans/GPClassify/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpclassify*"]
