[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtgp"
version = "0.1.0"
description = "Decision Tree Genetic Programming classifier with a scikit-learn-style API."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtgp*"]
